<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Plantão Bezerra</title>
<link rel="icon" type="image/png" href="assets/img/bezerra.png">
<link rel="apple-touch-icon" href="assets/img/bezerra.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="app-header">
  <img class="logo" src="assets/img/bezerra.png" alt="Logo Plantão Bezerra">
  <div class="brand">
    <h1>Plantão Bezerra</h1>
    <small id="hdr-sub">Registro de plantões hospitalares</small>
    <small id="hdr-room"></small>
  </div>
</header>
<main id="view"></main>
<nav class="tabbar" id="tabbar">
  <button data-action="tab" data-v="plantao"><svg class="ico"><use/></svg><span>Plantão</span></button>
  <button data-action="tab" data-v="prontuario"><svg class="ico"><use/></svg><span>Prontuário</span></button>
  <button data-action="tab" data-v="ajustes"><svg class="ico"><use/></svg><span>Ajustes</span></button>
</nav>
<input type="file" id="file-import" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script src="assets/js/app.js"></script>
</body>
</html>
